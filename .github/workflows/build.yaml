name: build-project
on: push

jobs:
  build-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
      - uses: cachix/install-nix-action@master
      - uses: cachix/cachix-action@master
        with:
          name: opensource
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - uses: damianfral/nix-cache-lookup@master
        id : nix-cache-lookup
        with:
          flake-attribute: .#default
      - run: nix build -L .#default --accept-flake-config
        if: steps.nix-cache-lookup.outputs.cached != 'true'

  build-dev-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
      - uses: cachix/install-nix-action@master
      - uses: cachix/cachix-action@master
        with:
          name: opensource
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - uses: damianfral/nix-cache-lookup@master
        id : nix-cache-lookup
        with:
          flake-attribute: .#devShells.x86_64-linux.default
      - run: nix build -L .#devShells.x86_64-linux.default --accept-flake-config
        if: steps.nix-cache-lookup.outputs.cached != 'true'


  flake-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
      - uses: cachix/install-nix-action@master
      - uses: cachix/cachix-action@master
        with:
          name: opensource
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - run: nix flake check --accept-flake-config

---
name: espbunker
version: 1.0.1

license: MIT

ghc-options:
  - -fwrite-ide-info
  - -Wall
  - -Wincomplete-uni-patterns
  - -Wincomplete-record-updates
  - -Wpartial-fields
  - -Widentities
  - -Wredundant-constraints
  - -Wcpp-undef
  - -Wunused-packages

dependencies:
  - aeson
  - aeson-casing
  - base
  - base64-bytestring
  - containers
  - data-default
  - free
  - indexed
  - indexed-free
  - optparse-applicative
  - optparse-generic
  - relude
  - text
  - vector
  - yaml

library:
  source-dirs: ./src/

executables:
  espbunker:
    main: Main.hs
    source-dirs: app/
    dependencies:
      - espbunker
      - relude
    ghc-options:
      - -rtsopts
      - -threaded
      - -with-rtsopts=-N

tests:
  espbunker-test:
    main: Spec.hs
    source-dirs: test
    ghc-options:
      - -rtsopts
      - -threaded
      - -with-rtsopts=-N
    dependencies:
      - espbunker
      - typed-process
      - sydtest
      - sydtest-discover
      - path

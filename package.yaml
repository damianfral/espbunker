---
name: espbunker
version: 1.0.1

license: MIT

ghc-options:
  - -fwrite-ide-info
  - -Wall
  - -Wincomplete-uni-patterns
  - -Wincomplete-record-updates
  - -Wpartial-fields
  - -Widentities
  - -Wredundant-constraints
  - -Wcpp-undef
  - -Wunused-packages

dependencies:
  - base
  - aeson
  - data-default
  - indexed-free
  - indexed
  - optparse-applicative
  - optparse-generic
  - relude
  - text
  - vector
  - yaml

library:
  source-dirs: ./src/

executables:
  espbunker:
    main: Main.hs
    source-dirs: ./src/
    ghc-options:
      - -rtsopts
      - -threaded
      - -with-rtsopts=-N

